<!-- TAB 4: GÁN NHÃN SẢN PHẨM (chèn vào app.py) -->
<div id="viewLabel" class="hidden">
    <main class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-12 gap-4">
        <!-- Cột trái: chọn chương trình, ảnh, thống kê, huấn luyện -->
        <aside class="col-span-3 space-y-3">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <label class="text-xs font-bold text-slate-600">Chương trình</label>
                <select id="lbProg" onchange="lbLoadImages()" class="w-full text-xs border border-slate-300 rounded-lg px-2 py-1.5"></select>
                <div class="text-[11px] text-slate-500" id="lbImgSummary"></div>
                <div id="lbImgList" class="max-h-[46vh] overflow-y-auto space-y-1"></div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <div class="text-xs font-bold text-slate-600">Dataset crop đã gán nhãn</div>
                <div id="lbStats" class="text-xs text-slate-700 space-y-0.5"></div>
                <button onclick="lbTrain()" id="lbTrainBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs">🧠 Huấn luyện bộ phân loại</button>
                <div id="lbTrainResult" class="text-[11px] text-slate-600 whitespace-pre-line"></div>
            </div>
        </aside>

        <!-- Giữa: ảnh + box -->
        <section class="col-span-6 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-2 gap-2 flex-wrap">
                <div class="text-xs font-bold text-slate-700" id="lbTitle">Chọn một ảnh bên trái</div>
                <div class="flex gap-1.5 text-xs">
                    <button onclick="lbRotate(270)" class="px-2 py-1 border rounded-lg hover:bg-slate-50" title="Xoay ngược chiều kim đồng hồ">↺ 90°</button>
                    <button onclick="lbRotate(90)" class="px-2 py-1 border rounded-lg hover:bg-slate-50" title="Xoay theo chiều kim đồng hồ">↻ 90°</button>
                    <button onclick="lbAcceptAi()" class="px-2 py-1 border rounded-lg hover:bg-slate-50">✅ Nhận gợi ý AI (≥80%)</button>
                    <button onclick="lbSave(true)" class="px-3 py-1 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">💾 Lưu & ảnh tiếp (Enter)</button>
                </div>
            </div>
            <div id="lbWrap" class="relative inline-block select-none mx-auto" style="max-width:100%;">
                <img id="lbImg" class="block max-h-[78vh] max-w-full rounded-lg" draggable="false" />
                <div id="lbBoxes" class="absolute inset-0"></div>
            </div>
            <div class="text-[11px] text-slate-500 mt-2">
                Bấm vào box để chọn rồi bấm nhãn (hoặc phím số). Kéo chuột trên vùng trống để tự vẽ box thiếu. Phím: <b>0</b> = Khác, <b>X</b>/Delete = bỏ box, <b>Enter</b> = lưu & tiếp.
                Nếu ảnh bị xoay ngang thì xoay trước khi gán nhãn.
            </div>
        </section>

        <!-- Phải: bảng nhãn -->
        <aside class="col-span-3 space-y-3">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <div class="text-xs font-bold text-slate-600">Gán nhãn cho box đang chọn</div>
                <div id="lbPalette" class="space-y-1.5"></div>
                <button onclick="lbSetLabel(null)" class="w-full text-xs border border-red-200 text-red-600 rounded-lg py-1.5 hover:bg-red-50">🗑 Bỏ box này (X)</button>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-xs font-bold text-slate-600 mb-1">Box trong ảnh</div>
                <div id="lbBoxList" class="text-[11px] text-slate-600 space-y-0.5 max-h-[30vh] overflow-y-auto"></div>
            </div>
        </aside>
    </main>
</div>

<script>
    const LB_COLORS = ["#2563eb", "#dc2626", "#16a34a", "#9333ea", "#ea580c", "#0891b2", "#be185d", "#4d7c0f", "#a16207"];
    let lbImages = [], lbCur = null, lbBoxes = [], lbSel = -1, lbSkus = [], lbDrag = null;
    // lbBoxes: [{box:[x1,y1,x2,y2] (0..1), label: sku|OTHER|null, pred:{sku,prob}|null}]
    // label null = chưa quyết định -> KHÔNG lưu; muốn bỏ box thì xoá khỏi danh sách.

    function lbColor(label) {
        if (!label) return "#eab308";
        if (label === "OTHER") return "#64748b";
        const i = lbSkus.findIndex(s => s.sku_code === label);
        return LB_COLORS[(i < 0 ? 8 : i) % LB_COLORS.length];
    }

    async function loadLabelTab() {
        const list = await (await fetch("/api/list_downloaded")).json();
        const sel = document.getElementById("lbProg");
        const keep = sel.value;
        sel.innerHTML = list.map(it => `<option value="${it.rel_path}">${it.name} (${it.count} ảnh)</option>`).join("");
        if (keep) sel.value = keep;
        if (list.length) await lbLoadImages();
        lbLoadStats();
    }

    async function lbLoadImages() {
        const dir = document.getElementById("lbProg").value;
        if (!dir) return;
        const progId = dir.split("/").pop();
        const cfg = await (await fetch("/api/get_config")).json();
        lbSkus = (cfg[progId] && cfg[progId].skus) || [];
        lbRenderPalette();
        lbImages = await (await fetch("/api/label_images?dir=" + encodeURIComponent(dir))).json();
        lbRenderImages();
    }

    function lbRenderImages() {
        const done = lbImages.filter(i => i.labeled > 0).length;
        document.getElementById("lbImgSummary").innerText = `Đã gán nhãn ${done}/${lbImages.length} ảnh`;
        document.getElementById("lbImgList").innerHTML = lbImages.map((it, i) => `
            <div onclick="lbOpen(${i})" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] border ${lbCur && lbCur.imageId === it.imageId ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:bg-slate-50'}">
                <span class="${it.labeled ? 'text-emerald-600' : 'text-slate-400'}">${it.labeled ? '✓' + it.labeled : '○'}</span>
                ${(it.customer || it.imageId).toString().slice(0, 28)}
            </div>`).join("");
    }

    function lbRenderPalette() {
        let h = lbSkus.map((s, i) => `
            <button onclick="lbSetLabel('${s.sku_code}')" class="w-full text-left text-xs rounded-lg border px-2 py-1.5 hover:bg-slate-50 flex items-center gap-2">
                <span class="w-3 h-3 rounded-sm" style="background:${LB_COLORS[i % LB_COLORS.length]}"></span>
                <b>${i + 1}</b> ${s.sku_name || s.sku_code}</button>`).join("");
        h += `<button onclick="lbSetLabel('OTHER')" class="w-full text-left text-xs rounded-lg border px-2 py-1.5 hover:bg-slate-50 flex items-center gap-2">
                <span class="w-3 h-3 rounded-sm" style="background:#64748b"></span><b>0</b> Khác (sản phẩm không thuộc chương trình)</button>`;
        document.getElementById("lbPalette").innerHTML = h;
    }

    async function lbOpen(i, force) {
        const it = lbImages[i];
        if (!it) return;
        lbCur = it; lbSel = -1; lbBoxes = [];
        const dir = document.getElementById("lbProg").value;
        document.getElementById("lbTitle").innerText = "⏳ Đang đề xuất box (lần đầu có thể mất vài giây)...";
        document.getElementById("lbImg").src = `/api/local_image?path=${encodeURIComponent(dir + '/' + it.file)}&t=${Date.now()}`;
        lbRenderImages();
        try {
            const r = await (await fetch(`/api/label_proposals?dir=${encodeURIComponent(dir)}&imageId=${it.imageId}${force ? '&force=1' : ''}`)).json();
            if (r.error) throw new Error(r.error);
            if (r.saved && r.saved.length) {
                lbBoxes = r.saved.map(s => ({box: s.box, label: s.label, pred: null}));
            } else {
                lbBoxes = r.boxes.map(b => ({box: b.box, label: null, pred: b.pred}));
            }
            document.getElementById("lbTitle").innerText = `${it.customer || it.imageId} — ${lbBoxes.length} box`;
        } catch (e) {
            document.getElementById("lbTitle").innerText = "Lỗi: " + e.message;
        }
        lbDraw();
    }

    function lbDraw() {
        const wrap = document.getElementById("lbBoxes");
        wrap.innerHTML = lbBoxes.map((b, i) => {
            const [x1, y1, x2, y2] = b.box, c = lbColor(b.label);
            const sel = i === lbSel;
            const tag = b.label ? (b.label === "OTHER" ? "Khác" : (lbSkus.find(s => s.sku_code === b.label) || {}).sku_name || b.label)
                                 : (b.pred ? `AI: ${b.pred.sku === "OTHER" ? "Khác" : b.pred.sku.replace("STAFF_", "")} ${Math.round(b.pred.prob * 100)}%` : "?");
            return `<div data-i="${i}" class="lb-box absolute" style="left:${x1 * 100}%;top:${y1 * 100}%;width:${(x2 - x1) * 100}%;height:${(y2 - y1) * 100}%;
                border:${sel ? 3 : 2}px ${b.label ? 'solid' : 'dashed'} ${c};background:${b.label ? c + '33' : 'transparent'};cursor:pointer;">
                <span style="position:absolute;left:0;top:-1px;background:${c};color:#fff;font-size:9px;padding:0 3px;line-height:12px;white-space:nowrap;">${i + 1}·${tag}</span></div>`;
        }).join("");
        document.getElementById("lbBoxList").innerHTML = lbBoxes.map((b, i) =>
            `<div class="cursor-pointer ${i === lbSel ? 'font-bold text-blue-700' : ''}" onclick="lbSel=${i};lbDraw()">${i + 1}. ${b.label || (b.pred ? 'AI gợi ý ' + b.pred.sku + ' ' + Math.round(b.pred.prob * 100) + '%' : 'chưa gán')}</div>`).join("");
    }

    function lbSetLabel(label) {
        if (lbSel < 0 || !lbBoxes[lbSel]) return;
        if (label === null) { lbBoxes.splice(lbSel, 1); lbSel = -1; }
        else { lbBoxes[lbSel].label = label; }
        lbDraw();
    }

    function lbAcceptAi() {
        lbBoxes.forEach(b => { if (!b.label && b.pred && b.pred.prob >= 0.8) b.label = b.pred.sku; });
        lbDraw();
    }

    async function lbSave(next) {
        if (!lbCur) return;
        const dir = document.getElementById("lbProg").value;
        const items = lbBoxes.filter(b => b.label).map(b => ({box: b.box, label: b.label}));
        const r = await (await fetch("/api/label_save", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({dir, imageId: lbCur.imageId, items})})).json();
        if (!r.ok) { alert("Lỗi lưu: " + (r.error || "")); return; }
        lbCur.labeled = items.length;
        lbLoadStats();
        const idx = lbImages.findIndex(i => i.imageId === lbCur.imageId);
        if (next && idx + 1 < lbImages.length) lbOpen(idx + 1); else lbRenderImages();
    }

    async function lbRotate(angle) {
        if (!lbCur) return;
        if (lbBoxes.some(b => b.label) && !confirm("Ảnh đã có box gán nhãn. Xoay sẽ bỏ các box này (crop đã lưu giữ nguyên). Tiếp tục?")) return;
        const dir = document.getElementById("lbProg").value;
        const r = await (await fetch("/api/rotate_image", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({dir, imageId: lbCur.imageId, angle: angle === 270 ? -90 : 90, rescore: false})})).json();
        if (!r.ok) { alert("Không xoay được: " + (r.error || "")); return; }
        const idx = lbImages.findIndex(i => i.imageId === lbCur.imageId);
        lbOpen(idx, true);
    }

    async function lbLoadStats() {
        const s = await (await fetch("/api/label_stats")).json();
        const rows = Object.entries(s.counts).map(([k, v]) => `<div class="flex justify-between"><span>${k}</span><b>${v}</b></div>`).join("");
        let m = "";
        if (s.model) m = `<div class="mt-1 text-emerald-700">Model: ${s.model.classes.length} lớp, ${s.model.n_train} crop${s.model.val_acc != null ? ', kiểm tra ' + Math.round(s.model.val_acc * 100) + '%' : ''}</div>`;
        document.getElementById("lbStats").innerHTML = (rows || '<div class="text-slate-400">Chưa có crop nào</div>') + m;
    }

    async function lbTrain() {
        const btn = document.getElementById("lbTrainBtn"), out = document.getElementById("lbTrainResult");
        btn.disabled = true; out.innerText = "⏳ Đang huấn luyện...";
        try {
            const r = await (await fetch("/api/label_train", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"})).json();
            if (!r.ok) throw new Error(r.error);
            let t = `Xong: ${r.classes.length} lớp, ${r.n} crop.\n`;
            t += r.val_acc != null ? `Độ chính xác trên tập kiểm tra giữ lại: ${Math.round(r.val_acc * 100)}%\n` + Object.entries(r.per_class).map(([k, v]) => `  ${k}: ${Math.round(v.acc * 100)}% (${v.n} mẫu)`).join("\n")
                                   : "Chưa đủ crop để đo độ chính xác (cần khoảng ≥50 crop, ≥6 crop mỗi lớp).";
            out.innerText = t;
            lbLoadStats();
        } catch (e) { out.innerText = "Lỗi: " + e.message; }
        btn.disabled = false;
    }

    // --- tương tác chuột trên ảnh: chọn box / kéo vẽ box mới
    (function () {
        const wrap = () => document.getElementById("lbWrap");
        function pos(e) {
            const r = document.getElementById("lbImg").getBoundingClientRect();
            return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
        }
        document.addEventListener("mousedown", e => {
            if (!wrap() || !wrap().contains(e.target)) return;
            const boxEl = e.target.closest(".lb-box");
            if (boxEl) { lbSel = +boxEl.dataset.i; lbDraw(); return; }
            lbDrag = {start: pos(e), cur: pos(e)};
        });
        document.addEventListener("mousemove", e => {
            if (!lbDrag) return;
            lbDrag.cur = pos(e);
            let g = document.getElementById("lbGhost");
            if (!g) { g = document.createElement("div"); g.id = "lbGhost"; g.style.cssText = "position:absolute;border:2px dashed #f59e0b;background:#f59e0b22;pointer-events:none;"; document.getElementById("lbBoxes").appendChild(g); }
            const [a, b] = [lbDrag.start, lbDrag.cur];
            g.style.left = Math.min(a[0], b[0]) * 100 + "%"; g.style.top = Math.min(a[1], b[1]) * 100 + "%";
            g.style.width = Math.abs(a[0] - b[0]) * 100 + "%"; g.style.height = Math.abs(a[1] - b[1]) * 100 + "%";
        });
        document.addEventListener("mouseup", () => {
            if (!lbDrag) return;
            const [a, b] = [lbDrag.start, lbDrag.cur]; lbDrag = null;
            const g = document.getElementById("lbGhost"); if (g) g.remove();
            if (Math.abs(a[0] - b[0]) > 0.015 && Math.abs(a[1] - b[1]) > 0.015) {
                lbBoxes.push({box: [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])], label: null, pred: null});
                lbSel = lbBoxes.length - 1; lbDraw();
            }
        });
        document.addEventListener("keydown", e => {
            const v = document.getElementById("viewLabel");
            if (!v || v.classList.contains("hidden") || ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
            if (e.key === "Enter") { lbSave(true); e.preventDefault(); }
            else if (e.key === "x" || e.key === "X" || e.key === "Delete" || e.key === "Backspace") { lbSetLabel(null); e.preventDefault(); }
            else if (e.key === "0") lbSetLabel("OTHER");
            else if (/^[1-9]$/.test(e.key) && lbSkus[+e.key - 1]) lbSetLabel(lbSkus[+e.key - 1].sku_code);
            else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                const idx = lbImages.findIndex(i => lbCur && i.imageId === lbCur.imageId) + (e.key === "ArrowDown" ? 1 : -1);
                if (idx >= 0 && idx < lbImages.length) lbOpen(idx);
                e.preventDefault();
            }
        });
    })();
</script>
